name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install (with the optional MCP SDK)
        run: pip install -e ".[test,mcp]"
      - name: Unit, hermetic e2e battery, MCP integration, and wheel packaging
        # The battery drives the real duet CLI against fake agent binaries,
        # so it runs fully offline; the DUET_E2E-gated real-CLI test skips.
        # tests/integrations drive `duet mcp serve` and `duet pair` against
        # provider emulators; real-provider tests stay gated and skip.
        # tests/test_packaging.py builds a wheel and runs it outside the tree.
        run: pytest -q

  test-as-root:
    # Containers and devcontainers commonly run as root; Duet must still work
    # there (only permission-bypass agents are disabled).
    runs-on: ubuntu-latest
    container: python:3.11
    steps:
      - uses: actions/checkout@v4
      - name: Install (core only: MCP tests skip, proving the core needs no SDK)
        run: pip install -e ".[test]"
      - name: Suite as root
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          id -u
          pytest -q
